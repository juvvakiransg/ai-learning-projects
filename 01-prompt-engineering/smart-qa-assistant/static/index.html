<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Q&A Assistant</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<main class="container">
  <header><p class="eyebrow">PROMPT ENGINEERING PLAYGROUND</p><h1>Smart Q&A Assistant</h1><p>Experiment with roles, styles and few-shot examples, then inspect the exact prompt sent to the model.</p></header>
  <section class="card">
    <label for="question">Your question</label>
    <textarea id="question" rows="4" placeholder="Example: What is dependency injection?">What is dependency injection?</textarea>
    <div class="grid">
      <div><label for="role">Role</label><select id="role"></select></div>
      <div><label for="style">Prompt style</label><select id="style"></select></div>
    </div>
    <label class="check"><input id="fewShot" type="checkbox" checked /> Use few-shot examples</label>
    <div class="actions"><button id="ask">Ask Assistant</button><button id="compare" class="secondary">Compare Patterns</button></div>
    <p id="status" class="status"></p>
  </section>
  <section id="singleResult" class="hidden">
    <div class="card"><h2>Generated Prompt</h2><pre id="prompt"></pre></div>
    <div class="card"><h2>AI Response</h2><p id="mode"></p><div id="answer" class="answer"></div></div>
  </section>
  <section id="comparison" class="hidden"><h2>Prompt Comparison</h2><div id="comparisonGrid" class="comparison-grid"></div></section>
  <footer><a href="/docs">Swagger API Docs</a> · <a href="/redoc">ReDoc</a> · <a href="/openapi.json">OpenAPI JSON</a></footer>
</main>
<script src="/static/app.js"></script>
</body>
</html>
